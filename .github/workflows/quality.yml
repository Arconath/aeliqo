name: Aeliqo product quality

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact source commit; required for codex/* candidates and optional on main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aeliqo-quality-${{ github.sha }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce owner-dispatched main or exact candidate source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REPOSITORY" = "Arconath/aeliqo"
          test "$ACTOR" = "hermawan22"
          test "$TRIGGERING_ACTOR" = "hermawan22"

          case "$SOURCE_REF" in
            refs/heads/main)
              if test -n "$EXPECTED_SOURCE_SHA"; then
                printf '%s\n' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
                test "$(printf '%s' "$EXPECTED_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')" = "$SOURCE_SHA"
              fi
              ;;
            refs/heads/codex/*)
              printf '%s\n' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
              test "$(printf '%s' "$EXPECTED_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')" = "$SOURCE_SHA"
              ;;
            *)
              echo "Quality dispatch source must be main or an owner-repository codex/* branch." >&2
              exit 1
              ;;
          esac

  product:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install the locked Node 24 and pnpm 11 toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build the exact public package candidate and documentation contract
        run: |
          pnpm test:release-tooling
          node scripts/release/candidate.mjs
          pnpm test:docs-artifact
      - name: Run the complete product command ledger
        run: pnpm check
      - name: Upload source-bound product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-quality-evidence-${{ github.sha }}
          path: |
            artifacts/product-ci
            artifacts/performance-workloads
            artifacts/performance-browser
            artifacts/visual-catalog
            artifacts/release-candidate
            harness/evidence/ci.json
          if-no-files-found: warn
          retention-days: 7
