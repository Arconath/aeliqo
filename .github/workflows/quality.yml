name: Aeliqo product quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aeliqo-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install the locked Node 24 and pnpm 11 toolchain
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build the exact public package candidate and documentation contract
        run: |
          pnpm test:release-tooling
          node scripts/release/candidate.mjs
          pnpm test:docs-artifact
      - name: Run the complete product command ledger
        run: pnpm check
      - name: Upload source-bound product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-quality-evidence-${{ github.sha }}
          path: |
            artifacts/product-ci
            artifacts/release-candidate
            harness/evidence/ci.json
          if-no-files-found: warn
          retention-days: 7
