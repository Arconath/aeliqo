name: Aeliqo quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.30.3
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: scripts/ci/check-runner-contract.sh
      - run: go test ./deploy/server.go ./deploy/server_test.go
      - run: pnpm check
      - run: pnpm check:packages
      - run: pnpm proof:stress
  container:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --tag aeliqo-ci:${{ github.sha }} .
      - run: |
          docker run --detach --rm --name aeliqo-ci -p 127.0.0.1::8080 aeliqo-ci:${{ github.sha }}
          trap 'docker stop aeliqo-ci' EXIT
          port="$(docker port aeliqo-ci 8080/tcp | sed 's/.*://')"
          for attempt in $(seq 1 30); do curl --fail --silent "http://127.0.0.1:$port/readyz" && break; sleep 1; done
          curl --fail --silent "http://127.0.0.1:$port/healthz"
          curl --fail --silent "http://127.0.0.1:$port/version" | jq -e --arg sha "${{ github.sha }}" '.revision == $sha'
