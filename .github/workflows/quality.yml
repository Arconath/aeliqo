name: Aeliqo functional quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact source commit; required for release/* candidates and optional on main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aeliqo-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce owner-dispatched main or exact candidate source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -eu
          test "$REPOSITORY" = "Arconath/aeliqo"
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'

          case "$EVENT_NAME" in
            push)
              test "$SOURCE_REF" = "refs/heads/main"
              ;;
            pull_request)
              case "$SOURCE_REF" in refs/pull/*/merge) : ;; *) exit 1 ;; esac
              ;;
            workflow_dispatch)
              test "$ACTOR" = "hermawan22"
              test "$TRIGGERING_ACTOR" = "hermawan22"
              case "$SOURCE_REF" in
                refs/heads/main)
                  if test -n "$EXPECTED_SOURCE_SHA"; then
                    printf '%s\n' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
                    test "$(printf '%s' "$EXPECTED_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')" = "$SOURCE_SHA"
                  fi
                  ;;
                refs/heads/release/*)
                  printf '%s\n' "$EXPECTED_SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
                  test "$(printf '%s' "$EXPECTED_SOURCE_SHA" | tr '[:upper:]' '[:lower:]')" = "$SOURCE_SHA"
                  ;;
                *)
                  exit 1
                  ;;
              esac
              ;;
            *)
              exit 1
              ;;
          esac

  functional:
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AELIQO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AELIQO_SITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install the locked framework and site toolchains
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      # Pull requests and pushes to main take the lane matching their changed
      # paths; owner dispatches always run the full matrix because package
      # publication requires a same-SHA full-quality success. Site redeploys
      # accept the site lane when package-affecting source is unchanged.
      - name: Select the check scope for this change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -Eeuo pipefail
          mode=full
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --quiet --depth=1 origin "$BASE_SHA"
            site_only=true
            changed=0
            while IFS= read -r path; do
              changed=$((changed + 1))
              case "$path" in
                docs/packages/*) site_only=false; break ;;
                apps/site/*|docs/site/*|docs/public-site/*|catalog/*|examples/catalog/*|scripts/docs/*|docs/*|README.md|AGENTS.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md) ;;
                *) site_only=false; break ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" HEAD)
            if [ "$site_only" = true ] && [ "$changed" -gt 0 ]; then mode=site; fi
          fi
          echo "mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Run required functional, security, browser, and package checks
        if: steps.scope.outputs.mode == 'full'
        run: pnpm check
      - name: Run the site-surface checks
        if: steps.scope.outputs.mode == 'site'
        run: |
          pnpm format:check
          pnpm lint
          pnpm site:test
      - name: Build and consume the five exact package candidates
        if: steps.scope.outputs.mode == 'full'
        run: |
          pnpm test:release-tooling
          node scripts/release/candidate.mjs
      - name: Verify the public documentation artifact
        run: pnpm test:docs-artifact
      - name: Verify the web, docs, playground, and static server contract
        if: steps.scope.outputs.mode == 'full'
        run: pnpm site:test
      - name: Require unchanged exact source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Build and smoke the production image contract
        run: |
          sdk_revision="$SOURCE_SHA"
          release_version="$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' release-metadata.json)"
          sdk_version="$(jq -er --arg version "$release_version" '.version | select(. == $version)' packages/core/package.json)"
          image="aeliqo-web-quality:$SOURCE_SHA"
          DOCKER_BUILDKIT=1 docker build \
            --file apps/site/Dockerfile \
            --build-arg "SOURCE_REVISION=$SOURCE_SHA" \
            --build-arg "SDK_SOURCE_REVISION=$sdk_revision" \
            --build-arg "SDK_VERSION=$sdk_version" \
            --tag "$image" \
            .
          apps/site/scripts/ci/check-static-image.sh "$image" "$SOURCE_SHA" "$sdk_revision" "$sdk_version"
          mkdir -p apps/site/artifacts/image-contract
          docker image inspect "$image" > apps/site/artifacts/image-contract/inspect.json
          sha256sum \
            apps/site/Dockerfile \
            apps/site/deploy/server.go \
            apps/site/scripts/ci/check-static-image.sh \
            packages/core/package.json \
            release-metadata.json \
            docs/public-site/routes.mjs \
            catalog/components.json \
            > apps/site/artifacts/image-contract/source-sha256.txt
      - name: Upload source-bound functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-quality-evidence-${{ env.SOURCE_SHA }}
          path: |
            artifacts/product-ci
            artifacts/performance-bundles
            artifacts/visual-catalog
            artifacts/vnext-visual
            artifacts/release-candidate
            apps/site/artifacts
          if-no-files-found: warn
          retention-days: 7
