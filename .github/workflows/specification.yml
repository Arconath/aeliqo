name: Specification and harness checks (not product readiness)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: specification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  specification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # verified v7.0.1; review runner requirements in M0
        with:
          persist-credentials: false
      - name: Check specification consistency
        run: python3 scripts/kit_check.py
      - name: Test harness safety and numerical oracle
        run: python3 -m unittest discover -s tests/harness -v
      - name: Test independent semantic and composition reference experiments
        run: python3 -m unittest discover -s tests/semantics_reference -v
      - name: Report pending implementation tasks
        run: |
          python3 - <<'CHECK'
          import json
          from pathlib import Path
          tasks = json.loads(Path('harness/tasks.json').read_text())['tasks']
          print('Required product tasks still pending:', sum(t['status'] != 'done' for t in tasks))
          print('These checks do not certify the product, package publication, or deployment.')
          CHECK

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.24.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build and check shared web platform
        run: |
          pnpm build:platform
          pnpm typecheck
          pnpm test:platform
          pnpm test:platform:browser
          pnpm test:design
          pnpm test:design:browser
      - name: Validate canonical core contracts and installed package
        run: |
          pnpm test:contracts
          pnpm test:task-experience
          pnpm test:semantics
          pnpm test:query
          pnpm test:data
          pnpm test:results
          pnpm test:regions
          pnpm test:actions
          pnpm test:interaction
          pnpm test:evaluation
          pnpm test:agents
          pnpm test:vertical
          pnpm test:vertical:browser
          pnpm --filter @aeliqo/reference-host test
          pnpm test:data:auth-retention
          pnpm test:core:consumers
          pnpm test:runtime:consumers
          pnpm test:vertical:consumers
          pnpm test:agent:consumers
      - name: Verify external installed packages
        run: pnpm test:platform:consumers
      - name: Verify production Next SSR and hydration
        run: pnpm test:next-platform
      - name: Check reference contracts with pinned compiler
        run: python3 scripts/test_reference.py
