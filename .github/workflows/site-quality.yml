name: Aeliqo docs and playground quality

on:
  pull_request:
    paths:
      - 'apps/site/**'
      - '.github/workflows/site-*.yml'
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - '.github/workflows/site-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeliqo-site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AELIQO_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      AELIQO_SITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install the locked site toolchain
        working-directory: apps/site
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify docs, playground, accessibility, and static server
        working-directory: apps/site
        run: pnpm check
      - name: Require unchanged exact source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Build and smoke the production image contract
        working-directory: apps/site
        run: |
          sdk_revision="$(jq -er '.sourceRevision' vendor/packages/manifest.json)"
          sdk_version="$(jq -er '.version' vendor/packages/manifest.json)"
          image="aeliqo-site-quality:$SOURCE_SHA"
          DOCKER_BUILDKIT=1 docker build \
            --build-arg "SOURCE_REVISION=$SOURCE_SHA" \
            --build-arg "SDK_SOURCE_REVISION=$sdk_revision" \
            --build-arg "SDK_VERSION=$sdk_version" \
            --tag "$image" .
          scripts/ci/check-static-image.sh "$image" "$SOURCE_SHA" "$sdk_revision" "$sdk_version"
          mkdir -p artifacts/image-contract
          docker image inspect "$image" > artifacts/image-contract/inspect.json
          sha256sum Dockerfile deploy/server.go scripts/ci/check-static-image.sh vendor/packages/manifest.json > artifacts/image-contract/source-sha256.txt
      - name: Upload site evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-site-quality-${{ env.SOURCE_SHA }}
          path: apps/site/artifacts
          if-no-files-found: warn
          retention-days: 7
