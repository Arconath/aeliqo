name: Publish relay image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aeliqo-relay-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'hermawan22' && github.triggering_actor == 'hermawan22'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require owner-dispatched current main with successful same-SHA functional quality
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          test "$GH_REPO" = "Arconath/aeliqo"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$SOURCE_SHA"
          mkdir -p artifacts/relay-release-policy
          gh api --method GET "repos/$GH_REPO/actions/workflows/quality.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs' > artifacts/relay-release-policy/quality-runs.json
          jq -e --arg sha "$SOURCE_SHA" \
            '[.[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | if length == 0 then error("no successful same-SHA functional quality run") else max_by(.run_number) end' \
            artifacts/relay-release-policy/quality-runs.json > artifacts/relay-release-policy/quality-run.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Verify the relay source builds and passes its gate
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm build:agent
          pnpm --dir apps/relay build
          pnpm --dir apps/relay test
      - name: Publish, attest, and scan the immutable relay image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          GH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_REPO: ${{ github.repository }}
        run: apps/relay/scripts/ci/publish-image.sh
      - name: Upload immutable image identity, provenance, SBOM, and vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-relay-production-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/relay-release-policy
            apps/relay/artifacts/production-image
          if-no-files-found: warn
          retention-days: 30
