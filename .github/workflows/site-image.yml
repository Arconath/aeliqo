name: Aeliqo rewrite site image

on:
  pull_request:
  push:
    branches: [rewrite/v0.1.0-master-foundation]

permissions:
  contents: read

concurrency:
  group: aeliqo-site-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
      - name: Install locked package manager and dependencies
        run: |
          npm install --global pnpm@11.24.0
          pnpm install --frozen-lockfile
      - name: Build the static site with Node 24 and pnpm 11
        run: pnpm build:site
      - name: Test the static server contract
        run: go test ./deploy/server.go ./deploy/server_test.go
      - name: Build the immutable-site candidate image
        run: docker build --build-arg SOURCE_REVISION=${{ github.sha }} --tag aeliqo-site:${{ github.sha }} .
      - name: Smoke operational routes, static cache policy, and security headers
        run: scripts/ci/check-static-image.sh aeliqo-site:${{ github.sha }} ${{ github.sha }}
