name: Publish verified Aeliqo packages

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Publish target; both targets use a non-latest dist-tag.'
        required: true
        type: choice
        options: [rc, stable]
      version:
        description: '0.1.0-rc.N for RC, or exactly 0.1.0 for stable.'
        required: true
        type: string
      rc_version:
        description: 'For stable only: the exact verified 0.1.0-rc.N predecessor.'
        required: false
        type: string

concurrency:
  group: aeliqo-npm-publication-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
      - name: Validate the manually selected release identity
        env:
          STAGE: ${{ inputs.stage }}
          VERSION: ${{ inputs.version }}
          RC_VERSION: ${{ inputs.rc_version }}
        run: |
          if [ "$STAGE" = rc ] && [[ "$VERSION" =~ ^0\.1\.0-rc\.[1-9][0-9]*$ ]] && [ -z "$RC_VERSION" ]; then exit 0; fi
          if [ "$STAGE" = stable ] && [ "$VERSION" = 0.1.0 ] && [[ "$RC_VERSION" =~ ^0\.1\.0-rc\.[1-9][0-9]*$ ]]; then exit 0; fi
          echo "Stage, version, and RC predecessor are not an allowed release identity." >&2
          exit 1
      - name: Install the locked package manager and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Require the source-complete prepublication gate
        run: |
          pnpm test:release-tooling
          pnpm release:ready
      - name: Reinstall and exercise the published RC before stable
        if: inputs.stage == 'stable'
        env:
          RC_VERSION: ${{ inputs.rc_version }}
        run: node scripts/release/registry-consumer.mjs --version "$RC_VERSION" --output artifacts/release-rc-consumer.json
      - name: Build and verify the exact publishable candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release/candidate.mjs --version "$VERSION"
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const candidate = JSON.parse(await readFile('artifacts/release-candidate/manifest.json', 'utf8'));
          if (candidate.sourceRevision !== process.env.GITHUB_SHA) throw new Error('Candidate source SHA differs from workflow SHA');
          if (candidate.version !== process.env.VERSION || candidate.packages.length !== 6) throw new Error('Candidate has an unexpected release identity');
          NODE
      - name: Publish in verified dependency order using trusted publishing
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          TAG=next
          if [ "$STAGE" = stable ]; then TAG=rewrite; fi
          node scripts/release/publish.mjs --tag "$TAG"
      - name: Reinstall the exact registry artifacts after publication
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/registry-consumer.mjs --version "$VERSION" --output artifacts/release-candidate/registry-consumer.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeliqo-npm-publication-${{ inputs.version }}-${{ github.sha }}
          path: |
            artifacts/release-candidate
            artifacts/release-rc-consumer.json
          if-no-files-found: warn
          retention-days: 30
