name: Publish Aeliqo production image

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aeliqo-production-image
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require owner-dispatched current main with successful same-SHA quality
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          test "$GH_REPO" = "Arconath/aeliqo"
          test "$EVENT" = "workflow_dispatch"
          test "$REF" = "refs/heads/main"
          test "$ACTOR" = "hermawan22"
          test "$TRIGGERING_ACTOR" = "hermawan22"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$SOURCE_SHA"
          mkdir -p artifacts/production-image-policy
          gh api --method GET "repos/$GH_REPO/actions/workflows/quality.yml/runs" \
            -f head_sha="$SOURCE_SHA" \
            -f branch=main \
            -f event=push \
            -f status=success \
            --jq '.workflow_runs' \
            > artifacts/production-image-policy/quality-runs.json
          jq -e --arg sha "$SOURCE_SHA" \
            '[.[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | if length == 0 then error("no successful same-SHA main quality run") else max_by(.run_number) | {id,run_number,head_sha,head_branch,event,conclusion,html_url} end' \
            artifacts/production-image-policy/quality-runs.json \
            > artifacts/production-image-policy/quality-run.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-production-image-policy-${{ github.sha }}
          path: artifacts/production-image-policy
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: policy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'hermawan22' && github.triggering_actor == 'hermawan22'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the hosted production-image runner
        run: scripts/ci/check-production-delivery.sh --runtime=hosted
      - name: Publish, smoke, attest, and scan the immutable image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          GH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/ci/publish-production-image.sh
      - name: Upload immutable image identity, provenance, SBOM, and vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeliqo-production-image-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-image
          if-no-files-found: warn
          retention-days: 30
