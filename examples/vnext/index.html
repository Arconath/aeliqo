<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aeliqo vNext presentation evidence</title>
    <style>
      :root {
        color-scheme: light;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #f6f7f9;
        color: #1e293b;
      }
      main {
        display: grid;
        gap: 1.5rem;
        max-width: 72rem;
        margin: 0 auto;
      }
      section {
        padding: 1rem;
        background: white;
        border: 1px solid #dbe2ea;
        border-radius: 0.75rem;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.75rem 0;
      }
      button {
        padding: 0.4rem 0.7rem;
      }
      [data-region-host] {
        width: 800px;
        max-width: 100%;
        min-height: 12rem;
        resize: horizontal;
        overflow: auto;
        border: 1px dashed #94a3b8;
      }
      aeliqo-region {
        display: block;
        min-height: 10rem;
      }
      [data-draft] {
        margin: 0.75rem;
        padding: 0.4rem;
      }
      [data-view-root] {
        display: grid;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Presentation evidence</h1>
      <p id="page-status" role="status">Loading…</p>

      <section aria-labelledby="people-heading">
        <h2 id="people-heading">People browse</h2>
        <div class="controls">
          <button type="button" data-action="people-table">Table</button>
          <button type="button" data-action="people-cards">Cards</button>
          <button type="button" data-action="people-invalid">Unsupported request</button>
        </div>
        <p id="people-status" role="status">Idle</p>
        <div id="people-host" data-region-host aria-label="People presentation">
          <input id="people-draft" data-dirty="true" aria-label="Draft note" placeholder="Draft note" />
        </div>
      </section>

      <section aria-labelledby="analysis-heading">
        <h2 id="analysis-heading">Workforce analysis</h2>
        <div class="controls">
          <button type="button" data-action="analysis-bar">Bar</button>
          <button type="button" data-action="analysis-trend">Trend</button>
        </div>
        <p id="analysis-status" role="status">Idle</p>
        <div id="analysis-host" data-region-host aria-label="Analysis presentation"></div>
      </section>

      <section aria-labelledby="compare-heading">
        <h2 id="compare-heading">Comparison</h2>
        <div class="controls">
          <button type="button" data-action="compare">Compare</button>
        </div>
        <p id="compare-status" role="status">Idle</p>
        <div id="compare-host" data-region-host aria-label="Comparison presentation"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
